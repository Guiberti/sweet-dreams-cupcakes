{% extends "base.html" %}
{% block titulo %}Criar conta · Sweet Dreams{% endblock %}
{% block conteudo %}
<section class="painel-form">
  <h1>Criar conta</h1>
  <form method="post" class="formulario" novalidate>
    <label for="nome">Nome completo *</label>
    <input id="nome" name="nome" required minlength="3" autocomplete="name" value="{{ dados.get('nome', '') }}">
    <label for="email">E-mail *</label>
    <input id="email" name="email" type="email" required autocomplete="email" value="{{ dados.get('email', '') }}">
    <label for="telefone">Celular (com DDD)</label>
    <input id="telefone" name="telefone" inputmode="tel" placeholder="(41) 99999-9999" data-mascara="telefone" value="{{ dados.get('telefone', '') }}">
    <label for="senha">Senha *</label>
    <div class="senha-campo">
      <input id="senha" name="senha" type="password" required minlength="8" autocomplete="new-password" aria-describedby="regra-senha">
      <button type="button" class="ver-senha" data-alvo="senha" aria-label="Mostrar senha">👁</button>
    </div>
    <small id="regra-senha" class="ajuda">Mínimo de 8 caracteres, com letras e números.</small>
    <label for="confirmacao">Confirmar senha *</label>
    <input id="confirmacao" name="confirmacao" type="password" required autocomplete="new-password">
    <label class="checkbox"><input type="checkbox" name="aceite_lgpd" {{ 'checked' if dados.get('aceite_lgpd') }}> Li e aceito os termos de uso e a política de privacidade (LGPD).</label>
    <button class="btn btn-primario">Criar conta</button>
  </form>
  <p class="centro">Já tem conta? <a href="{{ url_for('auth.login') }}">Entrar</a></p>
</section>
{% endblock %}
